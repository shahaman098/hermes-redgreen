name: redgreen
version: "1.0.0"
description: >-
  RedGreen proves a fix with a negative control before Hermes can call it done.
  It re-runs the test command itself and runs it again on the pre-change tree
  with the new tests overlaid. Only red without the fix and green with it counts.
author: shahaman098
license: MIT
requires_hermes: ">=0.18.0"
homepage: https://github.com/shahaman098/hermes-redgreen
tags: [testing, verification, git, reliability]
provides_tools:
  - redgreen_check
  - redgreen_status
  - redgreen_certificate
  - redgreen_history
  - redgreen_explain
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_verify
  - transform_llm_output
  - on_session_end
